<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI4S Agent — Wolfram enhanced</title>
<!--
  极简前端：单文件、无构建工具，直接由 FastAPI 托管（GET /）。
  （ChatPanel.vue 负责对话流、ArtifactManifest.vue 负责 WL 代码与图像产物、
  AgentControls.vue 负责会话开关，HTTP 走 frontend/src/api.ts 的 apiFetch）。
  现在这版只为不依赖 cheese 源码就能端到端验证后端流水线。
-->
<style>
  :root { --bg:#e9eef9; --panel:#4280e4; --line:#262b36; --fg:#e6e9ef; --dim:#9aa4b2; --acc:#4c8dff; --ok:#39b46a; --bad:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",monospace; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  header span { color:var(--dim); font-size:12px; }
  main { max-width:920px; margin:0 auto; padding:22px; }
  .row { display:flex; gap:10px; }
  input,button,textarea { font:inherit; border-radius:8px; border:1px solid var(--line); }
  input { flex:1; padding:11px 13px; background:var(--panel); color:var(--fg); }
  button { padding:11px 18px; background:var(--acc); color:#fff; border-color:var(--acc); cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  .chip { font-size:12px; color:var(--dim); border:1px solid var(--line); padding:3px 10px; border-radius:999px; cursor:pointer; }
  .chip:hover { color:var(--fg); border-color:var(--acc); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.03em; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .meta { color:var(--dim); font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  a { color:var(--acc); word-break:break-all; }
  /* 结果卡片：一段连贯叙述，图内联在 [[n]] 处，不复用 pre 的 monospace 排版 */
  .rich { font-size:14px; }
  .rich .para { margin:0 0 10px; }
  .rich pre { margin:10px 0; padding:10px 12px; background:#0f1218; border-radius:8px; }
  .rich figure { margin:12px 0; }
  .rich img { max-width:100%; border-radius:8px; display:block; }
  .rich figcaption { color:var(--dim); font-size:12px; margin-top:6px; }
  /* 阶段产物（探针原文 / WL / 思维链）可能很长，限高可滚，别把结果顶到屏幕外 */
  .card pre { max-height:280px; overflow:auto; }
  #status { margin-top:12px; color:var(--dim); font-size:12px; min-height:18px; }
  /* 页头那条链路就是进度条：走到哪个阶段哪个阶段亮起来，别让用户对着省略号干等 */
  #chain span { color:var(--dim); font-size:12px; }
  #chain span.on { color:var(--acc); font-weight:600; }
  #chain span.done { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>AI4S Agent</h1>
  <span id="chain">
    <span data-s="nl">Natural Language</span> →
    <span data-s="enhance">Semantic Enhancement</span> →
    <span data-s="wolfram">Wolfram</span> →
    <span data-s="summary">Summary</span></span>
  <span id="health"></span>
</header>

<main>
  <div class="row">
    <input id="q" placeholder="例：画个正弦曲线 / 这个矩阵 {{1,2},{3,4}} 的特征值是多少" autofocus />
    <button id="go">执行</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="status"></div>
  <div id="out"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = [
  ['画个正弦曲线', ''],
  ['这个矩阵 {{1, 2}, {3, 4}} 的特征值是多少', ''],
  ['帮我算 x^2 Sin[x] 在 0 到 Pi 上的定积分', ''],
  ['华东师范大学在哪里', ''],
  ['求解微分方程 y\'\'[x] + y[x] == 0', ''],
];
let session = 'default';

SAMPLES.forEach(([text]) => {
  const el = document.createElement('div');
  el.className = 'chip';
  el.textContent = text;
  el.onclick = () => { $('q').value = text; run(); };
  $('chips').appendChild(el);
});

$('go').onclick = run;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

fetch('/health').then(r => r.json()).then(h => {
  const w = h.wolfram;
  $('health').innerHTML = ` ${w.available
    ? '<span class="ok">Wolfram MCP 可用</span>'
    : '<span class="bad">Wolfram MCP 不可达</span>'} · 模型 ${h.model}`;
}).catch(() => {});

function card(title, html) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<h2>${title}</h2>${html}`;
  $('out').appendChild(d);
  return d;
}

function esc(s) {
  return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// ---- 富文本渲染：把叙述渲染成 HTML。只支持 ``` 围栏、[[n]] 图像、空行分段，够用即可 ----

function imgFigure(n, b64) {
  return b64
    ? `<figure><img src="data:image/png;base64,${b64}" alt="图 ${n}" />`
      + `<figcaption>图 ${n}</figcaption></figure>`
    : `<div class="bad">［图 ${n} 未取到］</div>`;
}

function inlineRich(text, images) {
  // split 带捕获组：奇数位就是占位符里的序号
  return text.split(/\[\[(\d+)\]\]/).map((c, i) =>
    i % 2 ? imgFigure(Number(c), images[Number(c) - 1])
          : esc(c).replace(/\n/g, '<br>')
  ).join('');
}

function renderRich(text, images) {
  const out = [];
  const fence = /```\w*\n([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = fence.exec(text || ''))) {
    out.push(paras(text.slice(last, m.index), images));
    out.push(`<pre>${esc(m[1].replace(/\n+$/, ''))}</pre>`);
    last = fence.lastIndex;
  }
  out.push(paras((text || '').slice(last), images));
  return out.join('');
}

function paras(text, images) {
  return text.split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
    .map(s => `<div class="para">${inlineRich(s, images)}</div>`).join('');
}

// ---- 阶段进度：页头那条链路是进度条，每段的可观察产物就地摊开 ----
const CHAIN = ['nl', 'enhance', 'wolfram', 'summary'];

function setStage(name, detail, payload) {
  const i = CHAIN.indexOf(name);
  document.querySelectorAll('#chain [data-s]').forEach(el => {
    const j = CHAIN.indexOf(el.dataset.s);
    el.className = i < 0 ? '' : j < i ? 'done' : j === i ? 'on' : '';
  });
  $('status').textContent = detail || '';
  if (payload) renderPayload(payload);
}

function renderPayload(p) {
  // 探针无条件显示：它的有无正是路由判据，空也要让人看见「为什么走了 chat」
  if ('probe' in p) {
    card('探针：WolframContext 返回', p.probe
      ? `<pre>${esc(p.probe)}</pre>`
      : '<div class="meta">WolframContext 无可用返回 → 判为 chat，走通用对话</div>');
  }
  if (p.wl) card('改写结果：Wolfram Language 表达式', `<pre>${esc(p.wl)}</pre>`);
  if (p.reasoning) card('Summary 思维链', `<pre>${esc(p.reasoning)}</pre>`);
}

// ---- SSE：POST 拿不到 EventSource，所以自己读流；只认 `data: {json}` 行 ----
async function* sse(resp) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(l => l.startsWith('data:'));
        if (line) yield JSON.parse(line.slice(5).trim());
      }
    }
  } finally {
    // 拿到 result 后生成器提前 return，流没读完 —— 主动 cancel 掉，否则控制台报 ERR_ABORTED
    reader.cancel().catch(() => {});
  }
}

function renderResult(data) {
  $('status').innerHTML = `<span class="meta">${esc(data.summary_line)}</span>`
    + (data.trace_path ? ` · <a href="/runs/${data.trajectory_id}" target="_blank">审计轨迹</a>` : '');

  if (data.mode === 'chat') {
    card('回答（通用对话，未执行代码）', `<pre>${esc(data.result)}</pre>`);
    return;
  }

  // 结果卡片只放「执行最终表达式得到的返回值」：叙述 + 内联图。表达式在改写阶段已展示过，
  // 执行方式、利用率、参考资料都是「用过 Wolfram」的痕迹，不摆这里（审计信息在状态行与轨迹里）。
  const imgs = data.images || [];
  // 兜底：模型被 max_tokens 截断时可能漏标某张图，别让图凭空消失 —— 补在段尾。
  const missing = imgs.map((_, i) => i + 1)
    .filter(n => !(data.result || '').includes(`[[${n}]]`))
    .map(n => imgFigure(n, imgs[n - 1])).join('');
  const main = card('结果', '');
  main.insertAdjacentHTML('beforeend',
    `<div class="rich">${renderRich(data.result, imgs)}${missing}</div>`);
}

async function run() {
  const query = $('q').value.trim();
  if (!query) return;
  $('go').disabled = true;
  $('out').innerHTML = '';
  setStage('nl', '');
  try {
    const resp = await fetch('/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: session, max_steps: 3, temperature: 0.7 }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || resp.statusText);
    }
    for await (const ev of sse(resp)) {
      if (ev.stage === 'result') { setStage('', ''); renderResult(ev.data); return; }
      if (ev.stage === 'error') throw new Error(ev.detail);
      setStage(ev.stage, ev.detail, ev.payload);
    }
    throw new Error('连接提前结束，未收到结果');
  } catch (e) {
    $('status').innerHTML = `<span class="bad">请求失败：${esc(e.message)}</span>`;
  } finally {
    $('go').disabled = false;
  }
}
</script>
</body>
</html>
